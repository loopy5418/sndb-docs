site_name: sndb
site_description: An embedded, typed, columnar database for Sonata
site_url: https://loopy5418.github.io/sndb-docs/
site_author: loopy5418
repo_url: https://github.com/loopy5418/sndb
repo_name: loopy5418/sndb
edit_uri: https://github.com/loopy5418/sndb-docs/edit/main/docs/

theme:
  name: material
  icon:
    logo: material/database
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Tables & columns: guide/tables.md
      - Types: guide/types.md
      - Queries: guide/queries.md
      - Full-text search: guide/search.md
      - Editing rows: guide/editing.md
      - Transactions: guide/transactions.md
      - Schema changes: guide/schema.md
      - Storage: guide/storage.md
  - Reference:
      - sndb: reference/sndb.md
      - Database: reference/database.md
      - Table: reference/table.md
      - Query: reference/query.md
      - Operators: reference/operators.md
      - Errors: reference/errors.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/loopy5418/sndb
